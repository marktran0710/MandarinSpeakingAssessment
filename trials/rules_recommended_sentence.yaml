# The combination the audit supports (sentence practice only): length-dependent and before-T4 tone-4 rules, and short
# syllables (analysed on < 130 ms) cannot be "Needs practice". Leaves out rule 9 (onset trim: hurts) and rule 7 (no effect).
sentence:
  confidence:
    practice_min_window_ms: 130
  tone:
    t4_by_duration:
      short_ms: 180
      medium_ms: 300
      min_fall_short_st: 1.5
      min_fall_medium_st: 2.0
      min_fall_long_st: 2.5
      require_end_below_start: true
    t4_before_t4:
      min_fall_st: 2.0
