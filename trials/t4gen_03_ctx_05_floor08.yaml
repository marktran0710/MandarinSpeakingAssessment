# Sentence tone 4 bars lowered by 0.3 st, 0.5 st less before a high onset, never below 0.8 st (2026-10-17). SENTENCES ONLY: single words keep t4_min_fall_st. The standard level and the easy level (the default) are changed the same way.
# before a high onset (next tone 1 or 4) a tone 4 needs 0.5 st less (floor 0.5); every sentence tone 4 needs 0.3 st less.
sentence:
  tone:
    t4_by_duration:
      min_fall_short_st: 1.2
      min_fall_medium_st: 1.7
      min_fall_long_st: 2.2
    t4_before_t4:
      relaxation_st: 0.5
      floor_st: 0.8
      next_tones: [1, 4]
levels:
  easy:
    sentence:
      tone:
        t4_by_duration:
          min_fall_short_st: 0.9
          min_fall_medium_st: 1.3
          min_fall_long_st: 1.7
        t4_before_t4:
          relaxation_st: 0.5
          floor_st: 0.8
          next_tones: [1, 4]
