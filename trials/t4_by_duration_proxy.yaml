# The same tone-4 rule applied to EVERYTHING (single words and the synthetic wrong-tone set). Only a stress-test proxy
# for the sentence-only trial: it shows how many wrong tones the looser tone-4 rule would let through as Good.
tone:
  t4_by_duration:
    short_ms: 180
    medium_ms: 300
    min_fall_short_st: 1.5
    min_fall_medium_st: 2.0
    min_fall_long_st: 2.5
    require_end_below_start: true
