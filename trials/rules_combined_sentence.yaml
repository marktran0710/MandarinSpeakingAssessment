# Rules 6 + 7 + 8(130) + 9 + the length-dependent tone-4 rule, all together (sentence practice only).
sentence:
  confidence:
    practice_min_window_ms: 130
  tone:
    t4_by_duration:
      short_ms: 180
      medium_ms: 300
      min_fall_short_st: 1.5
      min_fall_medium_st: 2.0
      min_fall_long_st: 2.5
      require_end_below_start: true
    t4_before_t4:
      min_fall_st: 2.0
    final_tail_guard:
      trim_frac: 0.2
      tones: [1, 2, 3]
    carryover_trim:
      frac: 0.15
      max_ms: 40
