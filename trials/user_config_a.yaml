# Trial A - the settings proposed by the project owner (2026-10-16), written with this pipeline's key names.
#   their name                                  -> our key
#   tone1.max_delta_st / max_core_range_st      -> tone.t1_max_delta_st / t1_max_range_st
#   tone2.min_rise_st / max_min_position        -> tone.t2_min_rise_st / t2_max_min_position
#   tone3.min_fall_st / min_full_rise_st        -> tone.t3_min_fall_st / t3_min_full_rise_st
#   tone3.min_position / max_position           -> tone.t3_min_position / t3_max_position
#   tone4.min_fall_st                           -> tone.t4_min_fall_st
#   tone3.require_final_rise_clause_final:false -> tone.clause_final_half_t3: true (this applies to single words too)
#   tone3.allow_half_t3: true                   -> no separate switch: a half-third is already accepted wherever the
#                                                  context allows it, so nothing to change
#   decision.likely_correct.min_quality/_match  -> confidence.likely_correct_quality / likely_correct_match
#   decision.practice.min_quality               -> confidence.practice_quality (0.80, unchanged)
#   decision.practice.max_match 0.20            -> confidence.practice_mismatch 0.80 (mismatch = 1 - match; unchanged)
tone:
  t1_max_delta_st: 2.5
  t1_max_range_st: 5.0
  t2_min_rise_st: 2.0
  t2_max_min_position: 0.85
  t3_min_fall_st: 1.5
  t3_min_full_rise_st: 1.5
  t3_min_position: 0.20
  t3_max_position: 0.85
  t4_min_fall_st: 2.5
  clause_final_half_t3: true

confidence:
  likely_correct_quality: 0.60
  likely_correct_match: 0.60
  practice_quality: 0.80
  practice_mismatch: 0.80
