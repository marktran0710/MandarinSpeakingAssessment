# One lever at a time (2026-10-17), on top of production: Tone 4 by syllable length only (1.5 / 2.0 / 2.5 st) in the BASE (words); sentences already have it.
tone:
  t4_by_duration:
    short_ms: 180
    medium_ms: 300
    min_fall_short_st: 1.5
    min_fall_medium_st: 2.0
    min_fall_long_st: 2.5
    require_end_below_start: true
