# Owner's final config to benchmark (2026-10-17): thresholds T1 2.5/5.0, T2 2.0/0.85, T3 1.5/1.5/0.20-0.85, T4 by length 1.5/2.0/2.5,
# geometric-mean scoring, Good 0.70/0.65, Needs practice 0.20/0.80, usable-F0 floor 100 ms; phrase mode adds the context rules.
# AS PASTED: clause-final half-T3 and the 100 ms floor apply to single words too.
tone:
  t1_max_delta_st: 2.5
  t1_max_range_st: 5.0
  t2_min_rise_st: 2.0
  t2_max_min_position: 0.85
  t3_min_fall_st: 1.5
  t3_min_full_rise_st: 1.5
  t3_min_position: 0.20
  t3_max_position: 0.85
  clause_final_half_t3: true
  t4_by_duration:
    short_ms: 180
    medium_ms: 300
    min_fall_short_st: 1.5
    min_fall_medium_st: 2.0
    min_fall_long_st: 2.5
    require_end_below_start: true
scoring:
  combine_features: geometric_mean
confidence:
  practice_min_window_ms: 100
sentence:
  confidence:
    practice_min_window_ms: 100
  tone:
    t4_before_t4:
      relaxation_st: 0.5
    soften_reduplication: true
    final_tail_guard:
      trim_frac: 0.2
      tones: [1, 2, 3]
