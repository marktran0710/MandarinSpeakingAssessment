# "Easy" level candidate (2026-10-17): every contour-SIZE demand of tones 2/3/4 scaled by 0.8 (tone 1 and the position limits unchanged).
# Learners flatten tones 2 and 4 (LATIC: 121 tone-4 and 68 tone-2 Needs-practice syllables look like tone 1); this accepts a smaller
# movement as that tone. The cost is that a flat or weak native tone is accepted too (trials/RESULTS.md).
tone:
  t2_min_rise_st: 2.0
  t3_min_fall_st: 1.6
  t3_min_full_rise_st: 1.6
  t4_min_fall_st: 2.4
sentence:
  tone:
    t4_by_duration:
      min_fall_short_st: 1.2
      min_fall_medium_st: 1.6
      min_fall_long_st: 2.0
    t4_before_t4:
      min_fall_st: 1.6
    left_context:
      - when: {tone: 2, previous: [1, 2]}
        set: {t2_min_rise_st: 1.6, t2_max_min_position: 0.90}
      - when: {tone: 2, previous_end_min_st: 3.0}
        set: {t2_min_rise_st: 1.6, t2_max_min_position: 0.90}
