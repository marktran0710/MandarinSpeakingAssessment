# Candidate "fit for non-native learners" (2026-10-17), chosen lever by lever (trials/lever_*.yaml) by learner gain per unit of false-accept cost:
#   quality 0.65 -> 0.60   learners +26 Good (of 855), wrong tones accepted +0.4 pt   <- the big one: learners' pitch tracks are noisier than teachers'
#   match   0.70 -> 0.65   learners +3, +0.8 pt                                        <- nearly free, nearly useless: learners' scores are ~0 or ~1
#   tone 2 / tone 3 shapes (final-config values)   learners +4 / +6, +0.7 / +1.1 pt
# NOT taken: tone 1 shape (+3.6 pt false accepts for ~nothing), geometric mean, 100 ms floor, half tone 3 at the end of words.
# Needs practice (match <= 0.20, quality >= 0.80), the 130 ms sentence floor and every earlier decision are unchanged.
confidence:
  likely_correct_quality: 0.60
  likely_correct_match: 0.65
tone:
  t2_min_rise_st: 2.0
  t2_max_min_position: 0.85
  t3_min_fall_st: 1.5
  t3_min_full_rise_st: 1.5
  t3_min_position: 0.20
  t3_max_position: 0.85
