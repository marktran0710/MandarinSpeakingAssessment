# Tone verification pipeline v1 - frozen / tunable config (see tone_pipeline.py).
#
# FROZEN      : pitch.* (Praat) and the calibration wide-pass settings. Do not tune.
# SPEAKER-ADAPTIVE: pitch_floor / pitch_ceiling / f0_median come from the student's calibration profile.
# TUNABLE     : sanity.*, cleanup.*, tone.*, neutral.*, confidence.*, profiles.* (tune against teacher labels).

calibration_version: speaker_f0_v1

pitch:
  time_step: 0.005
  max_candidates: 15
  silence_threshold: 0.03
  voicing_threshold: 0.35
  octave_cost: 0.01
  octave_jump_cost: 0.35
  voiced_unvoiced_cost: 0.14
  very_accurate: false

calibration:
  wide_floor: 50
  wide_ceiling: 600
  floor_scale: 0.40
  floor_min: 50
  floor_max: 120
  floor_round_to: 10          # 230 Hz median -> 92 -> 90 Hz
  ceiling_scale: 1.25
  ceiling_min: 350
  ceiling_max: 550
  ceiling_round_to: 50        # ceil_to_50: 346 * 1.25 = 432.5 -> 450 Hz
  # Recording-level quality gate. A failed gate raises CalibrationError; no profile is created.
  min_duration_sec: 4.9       # "5 s" with tolerance for decoder rounding
  max_duration_sec: 12.0
  # Steady voice (AC and CC agree) needed in the whole recording: 1 s is enough for a median and a pitch range. Real learners reading the five sounds twice
  # at a normal pace land at 2.1-2.4 s (Thanh Xuan 2.14, Obed 2.43; a stretched reference recording gives 4.4), so the old 2.0 s gate refused people by a hair
  # (Obed's second try, 15 s after a saved one, while speaking loudly: loudness is not what is measured). 1.2 s until 2026-10-18, 1.0 s on request.
  # Below preferred_voiced_sec the profile is saved with a warning in the calibration log (equal to the gate: no warning band).
  min_voiced_sec: 1.0
  preferred_voiced_sec: 1.0
  min_stable_frames: 30
  max_clipped_fraction: 0.005
  clip_level: 0.99
  min_median_hnr_db: 6.0      # whisper-like / very noisy recordings have no reliable harmonic structure
  hard_min_agreement: 0.60    # below this the profile is refused
  preferred_agreement: 0.80   # below this the profile is kept but flagged reliable=false with a warning
  boundary_hit_rate: 0.05     # wide pass touching 50 / 600 Hz more often than this -> unreliable
  boundary_margin_hz: 3.0
  octave_reject_st: 10.0      # frames this far from the first median are octave/subharmonic candidates
  # Isolated calibration tokens (媽 麻 馬 罵 嗎): reported as warnings, never as hard failures.
  token_count: 5
  token_gap_sec: 0.15
  token_min_voiced_sec: 0.30
  token_preferred_voiced_sec: 0.40
  token_min_frames: 50
  token_preferred_frames: 70

# Per-recording gate, run on the raw decoded signal before alignment (audio_prep.py).
audio_quality:
  frame_ms: 25
  min_duration_sec: 0.35
  max_duration_sec: 60.0
  clip_level: 0.99
  max_clipped_fraction: 0.005
  min_peak: 0.02              # about -34 dBFS: too quiet to analyse
  speech_rms_ratio: 0.10      # a frame is speech above this fraction of the loud-frame level
  min_speech_sec: 0.10        # short neutral syllables (吧, 的, 了) are ~0.15-0.2 s; this only has to catch 'no speech'
  snr_noise_percentile: 10    # SNR ~ loud-frame level over quietest-frame level (frame RMS percentiles)
  snr_speech_percentile: 95
  min_snr_db: 8.0
  voiced_min_hnr_db: 0.0      # Praat HNR frames above this count as voiced (pure noise sits below it)
  min_voiced_sec: 0.08
  min_median_hnr_db: 6.0
  hnr_min_voiced_sec: 0.30    # HNR over less voicing than this is too noisy an estimate to reject a recording on (SNR still applies)
  trim_padding_sec: 0.20
  trim_rms_ratio: 0.05
  target_peak: 0.95

sanity:
  ac_cc_tolerance_st: 1.0
  octave_jump_st: 7.0
  # A jump that big between adjacent frames is a tracking error (an octave slip, mostly on a creaky syllable tail). The syllable is
  # gated as octave_jump_in_segment unless the voiced fragment BEHIND the jump sits at an end of the syllable and lasts at most this
  # many ms: then the fragment is dropped and the rest is judged. 0 = off.
  jump_fragment_trim_ms: 40
  # Measured 2026-10-17: words Good 93.7 -> 95.4%, teacher sentences 93.0 -> 94.1%, learners +18 Good of 888,
  # the 520-clip stress test identical. A syllable (or recording) that needed a cut can be Good but never Needs practice.
  boundary_hit_rate: 0.05
  min_agreement: 0.80         # what "AC ~ CC" means as a ratio of co-voiced frames
  boundary_margin: 0.02       # a frame within 2% of floor/ceiling counts as touching it
  min_coverage_ratio: 0.60    # merged voiced frames / frames either tracker voiced; below = coverage collapse
  ceiling_retry_step_hz: 100
  ceiling_retry_min: 300
  ceiling_retry_max: 600
  floor_retry_step_hz: 20
  floor_retry_min: 50
  coverage_weight: 1.0        # pass selection: penalty for voicing fewer frames than the best pass
  octave_branch_penalty: 1.0  # pass selection: pass sits an octave above another pass (likely doubled)
  octave_jump_penalty: 0.5    # pass selection: per adjacent-frame jump >= octave_jump_st (counted up to 2)
  octave_branch_fraction: 0.45

cleanup:
  median_filter_frames: 5
  interpolate_gap_ms: 30
  fallback_onset_trim: 0.15
  fallback_offset_trim: 0.10
  octave_context_frames: 8
  octave_tolerance_st: 1.5
  # Sustained octave errors (a whole run tracked an octave off): move the less trustworthy of two runs that sit
  # exactly an octave apart. Non-octave jumps (creak, a new syllable) are never "corrected".
  octave_run_correction: true
  octave_run_decisive_ratio: 1.5   # the stronger run must score at least this much higher than the weaker
  octave_run_continuity_st: 3.0    # after the move the junction must be this smooth
  octave_range_st: 9.0             # a run this far from the speaker's median counts as half as plausible
  # A one-frame step this large inside a syllable is a tracking artefact, not a tone movement. If dropping the short
  # voiced run beyond such a step (at either edge of the analysis segment) changes the verdict, the syllable is
  # insufficient_evidence (edge_pitch_step): a few frames must not decide between accusing and accepting.
  edge_step_st: 3.5
  edge_fragment_ms: 40

alignment:
  min_syllable_ms: 70
  min_voiced_frames: 6
  allow_unk: false
  allow_spn: false
  nucleus_includes_medial_glide: true   # the window that is judged starts at a medial glide (w, j, ɥ) before the vowel, not at the vowel: the aligner often gives the glide half of it
  # Voiced speech outside every aligned syllable (a hesitation, a repeated or extra word, loose boundaries). Up to max_unaligned_voiced_fraction all is
  # well. Above hard_unaligned_voiced_fraction the alignment is not trusted and nothing is judged. In between it is DOUBTFUL: the syllables are judged
  # as usual but the recording cannot accuse anyone (Good or Okay, never Needs practice). Measured 2026-10-17: learners
  # (sentences) Good 67.2 -> 73.2% with Needs practice 2.9% unchanged; teacher audio read against a script missing the last 2 characters Good
  # 77.0 -> 93.3% (it was 94.8% with the full script); against ANOTHER sentence Good 12.3 -> 23.8% (about chance).
  max_unaligned_voiced_fraction: 0.25
  hard_unaligned_voiced_fraction: 0.40
  # A syllable the aligner squeezed to a ~90 ms stub (it only covers the previous syllable's fading tail) while the next one swallowed both: when the span up to the
  # next syllable's end holds exactly two voiced stretches, the stub gets the first and the next syllable the second. Repaired syllables are judged but never accuse.
  # Found 2026-10-17 on a live 這個 (the chart began with that tail, 這 was Okay and 個 was judged on both falls).
  repair_collapsed:
    enabled: true
    stub_max_ms: 130                    # the aligner leaves 90-110 ms (before the boundary search moves them by up to 20 ms)
    bridge_ms: 40                       # voiced gaps up to this are one stretch
    min_run_ms: 70                      # a stretch shorter than this is not a syllable
    onset_ms: 100                       # the repaired syllable starts this long before its voiced stretch (the consonant)
  skip_mfa_single_syllable: true        # one-syllable script: the syllable is the longest voiced run, no forced alignment
  single_syllable_bridge_ms: 80          # voiced gaps up to this are bridged when finding that run
  # Stock mandarin_taiwan_mfa plus the catalog characters it lacks (python build_mfa_dictionary.py).
  # Relative paths resolve against this project folder; a bare name uses an installed MFA dictionary.
  mfa_dictionary: mfa/mandarin_taiwan_catalog.dict
  mfa_acoustic_model: mandarin_mfa
  mfa_timeout_sec: 120

# An item with several variants (哪裡/哪兒, 裡(面)) only needs ONE reading scored. A clip may hold more than one
# reading (say 裡面 then 裡); separate readings are found by pauses and the best (reading, variant) pair is scored.
variants:
  split_on_pause_ms: 180      # a pause at least this long separates two readings
  min_chunk_ms: 150
  chunk_padding_ms: 120
  max_chunks: 3
  chunk_rms_ratio: 0.10       # a frame is speech above this fraction of the loud-frame level

# MFA boundaries between sonorants are uncertain. Search a small window around each shared boundary for a
# segmentation in which the expected tones fit, so `practice` needs EVERY plausible segmentation to disagree.
boundary_search:
  enabled: true
  max_shift_ms: 60
  step_ms: 20
  shift_penalty: 0.05         # per unit of |shift| / max_shift, so ties keep the aligner's boundary

tone:
  t1_max_delta_st: 2.0
  t1_max_range_st: 4.0

  t2_min_rise_st: 2.5
  t2_max_min_position: 0.8

  t3_min_fall_st: 2.0
  t3_min_full_rise_st: 2.0
  t3_min_position: 0.25
  t3_max_position: 0.80

  t4_min_fall_st: 3.0

  clause_final_half_t3: false  # true = a clause-final T3 may also be a low fall (half-third); sentence practice turns it on
  # Single words: a tone 3 at the end of the word must be said in full to be Good. A low fall with no rise is Okay (with the
  # advice "say it in full"), never "Needs practice". Sentences accept the half-third as Good, so this never applies there.
  # Stress test (520 clips): wrong tones shown Good unchanged at 20.0%; 13 half-third-like syllables Needs practice -> Okay.
  half_t3_end_as_okay: true

  # Off in the base config (single-word practice uses the single t4_min_fall_st above); ON in the `sentence:` profile below.
  # When present, the fall a tone 4 needs depends on how long
  # the aligned syllable is: < short_ms, < medium_ms, or longer; and require_end_below_start makes a tone 4 that does not
  # end lower than it starts score 0. Meant for sentence practice:
  # left_context:                # (off) tolerance by neighbour. Rules apply in order:
  #   - when: {tone: 2, previous: [1, 2]}        # also: next, phrase_final, previous_end_min_st / previous_end_max_st
  #     set: {t2_min_rise_st: 2.0, t2_max_min_position: 0.90}
  # soften_reduplication: true     # the second character of a repeated pair (看看, 謝謝) can never be "Needs practice"
  # final_tail_guard:             # clause-final tones 1/2/3: judge them without the last trim_frac of the syllable (final lowering)
  #   trim_frac: 0.2
  #   tones: [1, 2, 3]
  # carryover_trim:               # leave out the start of a syllable that has a neighbour on its left (the previous tone's pitch)
  #   frac: 0.15
  #   max_ms: 40
  # t4_before_t4:                 # a tone 4 directly followed by another tone 4 (also across a word end) needs only this much
  #   min_fall_st: 2.0            # fall; the second tone 4 keeps the normal rule.
  # t4_by_duration:
  #   short_ms: 180
  #   medium_ms: 300
  #   min_fall_short_st: 1.5
  #   min_fall_medium_st: 2.0
  #   min_fall_long_st: 2.5
  #   require_end_below_start: true

# Neutral tone is NOT scored (v1): the script says which syllables are neutral, nothing is classified as T1-T4 and no
# duration / pitch-range rule is applied. A neutral syllable is likely_correct when its audio is usable (same gates as
# every syllable) and insufficient_evidence otherwise. It can never be `practice`.
neutral:
  allow_practice: false       # v1 policy; enforced silently by enforce_neutral_policy

# How the factors of ONE tone's fit are combined into its match score (0..1): "product" (today) or "geometric_mean" (the n-th root
# of the product; three factors of 0.85 give 0.85 instead of 0.61, a factor of 0 still gives 0). The boundary search always uses
# the product.
scoring:
  combine_features: product

confidence:
  likely_correct_quality: 0.65
  likely_correct_match: 0.70

  practice_quality: 0.80
  practice_mismatch: 0.80     # tone_mismatch = 1 - tone_match
  practice_min_window_ms: 0   # a syllable analysed on a window shorter than this cannot be `practice`; 0 = off (single words)

  unstable_pitch_quality_factor: 0.75   # pitch track still suspicious after all retries: caps quality below practice_quality
  # Who gets that penalty when a pitch jump is left inside ONE syllable's segment: "utterance" = every syllable of the recording
  # (the old rule: one jump in an 11-syllable sentence dragged all of them under the Good bar), "syllable" = only the syllables that
  # contain a jump (they are gated as octave_jump_in_segment anyway). A track that is unreliable as a whole penalises everyone in both
  # modes, and with "syllable" a spared syllable can be Good but a recording with a jump anywhere still cannot produce a Needs practice.
  # Measured 2026-10-17: learners +35 Good of 855 sentence syllables, teachers +16 Good,
  # no new false alarm, wrong tones shown Good 20.0% -> 20.0%.
  unstable_scope: syllable

  quality_weights:
    ac_cc_agreement: 0.35
    voiced_coverage: 0.25
    octave_stability: 0.25
    alignment_quality: 0.15

# Acoustic F0 profile (not sex/gender), by calibrated median F0.
profiles:
  low_max_median_hz: 140
  mid_max_median_hz: 200
  high_max_median_hz: 270     # above this: very_high

feedback:
  likely_correct: "Tone looks good."
  insufficient_evidence: "Not enough reliable pitch information. Try again."
  audio_quality:
    clipped: "The recording is distorted. Move back from the microphone and try again."
    too_quiet: "The recording is too quiet. Speak louder or move closer to the microphone."
    noisy: "There is too much background noise. Try again somewhere quieter."
    too_short: "The recording is too short. Try again."
    too_long: "The recording is too long. Record only the practice phrase."
    no_speech: "No speech was detected. Try again."
    no_voicing: "No clear voice pitch was detected. Speak aloud rather than whispering."
  practice:
    1: "Practice keeping this syllable high and level."
    2: "Practice the rising movement on this syllable."
    3: "Practice the low dipping movement on this syllable."
    4: "Practice the falling movement on this syllable."

# Sentence practice (book / custom) only. tone_assessment.get_config("sentence") layers these over the settings above;
# single-word practice never sees them.
# Difficulty levels: the same pipeline asking for a smaller contour movement. A level is layered on top of the config (and of the
# `sentence:` profile in sentence practice); the request may name one (form field `level`), otherwise `default` (easy) applies.
#   easy: every contour-size demand of tones 2, 3 and 4 is 0.8 of the standard one; tone 1 and the position limits are unchanged.
# Why: learners flatten tones 2 and 4 (on 4 learners of Mandarin 121 tone-4 and 68 tone-2 Needs-practice syllables look like tone 1) and
# their contours are smaller than a teacher's (median tone-4 fall 3.4 st vs 4.1, tone-3 dip 3.1 vs 5.7). Measured 2026-10-17
# with scale 0.8: 4 learners (LATIC, 1838 syllables) Good 64.3% -> 69.0%, Needs practice 14.3% -> 11.9%;
# the price is on the other side: 520 wrong-tone clips flagged 48.0% -> 46.1%, wrong tones shown Good 20.0% -> 21.3%, and native tones
# said as the wrong tone accepted +1.7 points.
# Did the speaker say more or less than the script? Judged from the alignment and the voiced stretches (no speech recognition); only for texts of at least
# min_syllables syllables. Measured 2026-10-17 on teacher audio read against right and wrong scripts (2 or 4 characters missing = said MORE, 2 or 4 added =
# said LESS): 0 of 24 right scripts flagged, 2% of the learner recordings on file (3 of 120; two of them also the longest extra speech).
#   longer:  voiced speech before the first / after the last syllable of >= longer_extra_syllables median syllables (said more: 45-60% of the 2-character
#            cases, 60-100% of the 4-character ones). The result is judged but cannot accuse anyone, and the page says to read exactly the text shown.
#   shorter: >= shorter_squeezed of the two first / two last syllables squeezed (< tiny_syllable_ms) or empty (56-80% of the 2-character cases, 91% of 4),
#            or >= shorter_gate_squeezed squeezed anywhere: the alignment is not trusted and nothing is judged.
length_check:
  min_syllables: 4
  tiny_syllable_ms: 75
  longer_extra_syllables: 1.5
  shorter_squeezed: 2
  shorter_gate_squeezed: 3

# "You read too fast": the typical aligned syllable shorter than fast_median_syllable_ms (teachers read at 230-360 ms per syllable, the learners
# on file at 240-410 ms), or at least too_short_share of the syllables too short to analyse. The page then says: read slower, or stretch each
# sound. Looked at 2026-10-17: the share of too-short syllables does NOT follow the overall speed (short function words 不 個 一), so both are tested.
pace:
  exclude_tones: [4, 5]       # tone 4 is the shortest tone (single words: 355 ms vs 410-480; teachers) and the light tone shorter still: never asked to be drawn out
  fast_median_syllable_ms: 210
  too_short_share: 0.30
  min_syllables: 3

levels:
  default: easy                 # what EVERY learner gets, Taiwanese and foreign alike: the page has no strict-mode switch any more (removed 2026-10-18 on request);
                                # only an API / tool request may still name `level: standard`
  default_by_group: {}          # optional per-group override, e.g. {taiwanese: standard}
  easy:
    tone:
      t2_min_rise_st: 2.0
      t3_min_fall_st: 1.6
      t3_min_full_rise_st: 1.6
      t4_min_fall_st: 1.8           # single words, easy level (2.4 until 2026-10-17; standard stays 3.0). Real single words fall ~10 st (teachers' median 9.9,
                                    # learners' 12.0), so the bar rarely binds: teacher words unchanged; the 520-clip stress test, tone-4 syllables: unchanged syllables
                                    # flagged Needs practice 19.8 -> 11.5%, wrong tones shown Good 2.9 -> 6.6% (mostly time-reversed contours, which are really falls).
                                    # 2.0 would give most of that gain (12.5%) for 3.3% false accepts; 1.5: 10.4% and 7.4%.
    sentence:
      tone:
        t4_by_duration:               # Easy, on request 2026-10-18: the old shape (a longer syllable needs a bigger fall) with the smallest bar cut from 0.6 to 0.32 and the
          short_ms: 180               # others scaled by the same factor (0.32 / 0.6 = 0.53): 0.6 / 0.9 / 1.3 / 1.7 -> 0.32 / 0.48 / 0.69 / 0.91. Good needs 82% of a bar, so a
          medium_ms: 300              # tone 4 is Good from ~0.26 st (clipped) to ~0.75 st (>= 300 ms). Earlier the same day: 0.5 / 0.25 / 0.25 0.38 0.54 0.71 / 0.14 0.21 0.30 0.40
          tiny_ms: 140                # (the last: jull's tone-4 syllables 80.4% Good, native tone 1 / tone 2 accepted as a tone 4 9% / 13%; old bars 72.2%, 2% / 7%).
          min_fall_tiny_st: 0.32
          min_fall_short_st: 0.48
          min_fall_medium_st: 0.69
          min_fall_long_st: 0.91
          require_end_below_start: true
        t4_before_t4:                 # (with a bar below the floor the relaxation changes nothing: it never makes a bar stricter, and the 0.8 floor only holds up a lowered bar)
          relaxation_st: 0.5
          floor_st: 0.8
          next_tones: [1, 4]
        left_context:
          - when: {tone: 2, previous: [1, 2]}
            set: {t2_min_rise_st: 1.6, t2_max_min_position: 0.90}
          - when: {tone: 2, previous_end_min_st: 3.0}
            set: {t2_min_rise_st: 1.6, t2_max_min_position: 0.90}

sentence:
  confidence:
    practice_min_window_ms: 130   # a reduced function word (不, 個, 一, 得) or a fast T2 on <130 ms of voicing cannot support an accusation;
                                  # it gets "say it a bit more slowly" instead (was 100; raised after the 100 teacher sentences: false alarms 15 -> 8)
    # Tone 4 is the fastest tone, so it may be accused on a shorter window (100 ms analysed = ~165 ms syllable). Of the learners' tone 4 under 130 ms, 15 of 69 were RISING and 8 flat,
    # yet none could be flagged. Measured 2026-10-17: 100 teacher sentences false alarms 6 -> 8; learners' tone 4 flagged 14.5 -> 16.7% (LATIC), 4.9 -> 7.0% (archived).
    practice_min_window_ms_by_tone:
      4: 100

  tone:
    clause_final_half_t3: true    # teachers read a clause-final T3 as a low fall; the final rise is not required
    # Tone 4 in running speech is short and falls less than in a careful word (median fall 4.0 st vs 8.8 st). Verdict-only
    # rules (the boundary search never sees them). On the 100 teacher sentences with the 130 ms floor above:
    # Good 89.8% -> 91.3%, false alarms 15 -> 8, nothing got worse.
    t4_by_duration:               # the fall a tone 4 needs depends on how long the aligned syllable is
      short_ms: 180
      medium_ms: 300
      tiny_ms: 140                # < 140 ms: a really clipped tone 4 (a fast one in running speech: 12 of the teachers', 6 of the learners' tone 4s); the window
      min_fall_tiny_st: 0.9       # is under ~85 ms so it can never be accused, only be Good or Okay. Added 2026-10-17 on request; no data point fell between the old and the new bar
      min_fall_short_st: 1.2      # < 180 ms     (1.5 until 2026-10-17)
      min_fall_medium_st: 1.7     # 180 - 300 ms (2.0)
      min_fall_long_st: 2.2       # >= 300 ms    (2.5)
      require_end_below_start: true
    # A tone 4 followed by a syllable that starts high (tone 1, or another tone 4) is cut short: it needs relaxation_st less, never below floor_st
    # (so a flat line never passes). Sentences only: single words keep t4_min_fall_st. Measured 2026-10-17: 4 learners
    # (LATIC) tone-4 Good 57.5 -> 61.9%, archived attempts 60.6 -> 63.4%; native tone 1 accepted as a tone 4 1.3 -> 1.7%; 100 teacher sentences Good
    # 95.0 -> 95.2% with 6 false alarms before and after. (Teachers' tone 4 falls the same ~4 st before a high onset as before a low one; it is the learners'
    # shallow falls, median 2.2 st, that this is for.)
    t4_before_t4:
      relaxation_st: 0.5
      floor_st: 0.8
      next_tones: [1, 4]
    # A tone 3 is first of all LOW: a syllable that starts low (<= -2 st), reaches a point >= 3 st below the speaker's median and never gets high
    # (max <= 1.5 st) is accepted as a tone 3, with or without a rise. Said at the start of a clause or after a low syllable there is no fall into
    # the low point, which both other forms require: all 8 tone-3 syllables of the learner recordings that were Needs practice had none, and 5 of
    # them were correct low-rising tone 3s (verdict-only). Measured 2026-10-17: archived attempts, tone 3 Good
    # 67.4 -> 78.5%; LATIC 69.8 -> 74.0%; 100 teacher sentences Good 94.1 -> 95.0% with 7 false alarms before and after; native tones said as
    # the wrong tone accepted 22.7 -> 22.8%.
    t3_low_register:
      max_start_st: -2.0
      min_depth_st: 3.0
      max_st: 1.5
    # Tone 1 against tone 4 (verdict-only). In sentences a tone 4 may fall only ~1 st, so the two overlapped: a tone 1 was Good for ANY drift up to 2.6 st, either way.
    # A tone 1 hardly ever falls (teachers: 90% fall less than 0.2 st) and a rise is not what a shallow tone 4 looks like, so a FALL now has its own allowance: Good up to
    # about 2.0 st (t1_max_fall_st + 0.3 x width), nothing at 2.7; a rise keeps 2.6. And a tone 4 that falls less than `below_st` must fall steadily: at least
    # min_down_share of the steps (5-frame means) must not rise (teacher tone 4: median 1.00; teacher tone 1: 0.40). Measured 2026-10-17:
    # native tone 4 accepted as a tone 1 8.5 -> 4.1%, native tone 1 accepted as a tone 4 2.9 -> 2.1%, teachers' tone 1 and tone 4 read correctly unchanged (95.8 / 96.9%),
    # 100 teacher sentences unchanged (Good 95.2%, 6 false alarms). Price on learners: tone 1 Good 93.9 -> 92.1% (LATIC), 89.4 -> 87.4% (archived attempts); tone 4 Good 64.3 -> 63.1%.
    # A fall limit of 1.5 st separated them most (tone 4 as tone 1: 2.3%) but cost the learners' tone 1 14 points (93.9 -> 80.2%).
    t1_max_fall_st: 1.7
    t1_fall_width_st: 1.0
    t4_steady:
      below_st: 2.0
      min_down_share: 0.70
    # Left context: a syllable is judged knowing what came before it. A tone 2 right after a high tone (a tone 1/2, or any
    # syllable whose pitch ended 3+ st above the speaker's median) has to dip first and rises less: native tone 2 is Good
    # only 68-82% of the time there (95% elsewhere). Rules apply in order; verdict-only (the boundary search never sees them).
    # 100 teacher sentences: Good 91.3% -> 91.8%, false alarms 8 -> 7; the cost (native tones 1/3/4 now accepted as a tone 2
    # in that context) is +12 of 957.
    left_context:
      - when: {tone: 2, previous: [1, 2]}
        set: {t2_min_rise_st: 2.0, t2_max_min_position: 0.90}
      - when: {tone: 2, previous_end_min_st: 3.0}
        set: {t2_min_rise_st: 2.0, t2_max_min_position: 0.90}
